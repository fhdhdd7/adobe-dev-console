name: Wave 8 Browser Transport Inspection

on:
  push:
    branches:
      - wave8-adobe-github-oauth-preflight

permissions:
  contents: read

jobs:
  inspect-browser-transport:
    name: Inspect AppDeploy browser transport
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public frontend assets for API transport
        shell: bash
        run: |
          set -euo pipefail
          base='https://wave-8-adobe-oauth-bridge-x52n4k.v2.appdeploy.ai'
          html="$(mktemp)"
          trap 'rm -f "$html"' EXIT
          curl --fail --silent --show-error --location "$base/" -o "$html"
          echo 'WAVE8_ROOT=200'
          echo 'WAVE8_SCRIPT_ASSETS_BEGIN'
          grep -oE '<script[^>]+src="[^"]+"' "$html" | sed -E 's/.*src="([^"]+)"/\1/' | sort -u || true
          echo 'WAVE8_SCRIPT_ASSETS_END'

          mapfile -t assets < <(grep -oE '<script[^>]+src="[^"]+"' "$html" | sed -E 's/.*src="([^"]+)"/\1/' | sort -u)
          for asset in "${assets[@]}"; do
            if [[ "$asset" == http* ]]; then url="$asset"; else url="$base/${asset#./}"; fi
            js="$(mktemp)"
            curl --fail --silent --show-error --location "$url" -o "$js"
            echo "WAVE8_ASSET=${asset}"
            grep -oE 'https://[A-Za-z0-9._/-]*appdeploy[A-Za-z0-9._/?=&%-]*|/[A-Za-z0-9._-]*(__appdeploy|appdeploy|api)[A-Za-z0-9._/?=&%-]*|x-[Aa]pp[Dd]eploy-[A-Za-z0-9_-]+|__appdeploy[A-Za-z0-9_./?=&%-]*' "$js" | sort -u | head -n 80 || true
            rm -f "$js"
          done
