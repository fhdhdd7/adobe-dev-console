name: Wave 8 Adobe OAuth Internal Transport Probe

on:
  push:
    branches:
      - wave8-adobe-github-oauth-preflight

permissions:
  contents: read

jobs:
  oauth-probe:
    name: Adobe OAuth via AppDeploy internal transport
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run sanitized auth-only probe
        shell: bash
        run: |
          set -euo pipefail
          api='https://api-v2.appdeploy.ai/app/wave-8-adobe-oauth-bridge-x52n4k'
          response="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$response" "$headers"' EXIT

          health_http="$({ curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$api/api/_healthcheck"; } || true)"
          echo "WAVE8_INTERNAL_HEALTH_HTTP=${health_http}"

          http_status="$({ curl --silent --show-error \
            --dump-header "$headers" \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$api/api/adobe/probe"; } || true)"

          echo "WAVE8_INTERNAL_PROBE_HTTP=${http_status}"
          grep -iE '^(content-type|server|www-authenticate|x-appdeploy[^:]*):' "$headers" | sed 's/^/WAVE8_HEADER /' || true

          if [[ "$http_status" != "200" ]]; then
            echo "WAVE8_RESULT=INTERNAL_TRANSPORT_HTTP_FAILURE"
            exit 1
          fi

          if ! jq -e 'type == "object" and (.state | type == "string")' "$response" >/dev/null 2>&1; then
            echo "WAVE8_RESULT=INVALID_SANITIZED_RESPONSE"
            head -c 200 "$response" | tr '\n' ' ' | sed 's/[^[:print:]]/?/g'
            echo
            exit 1
          fi

          state="$(jq -r '.state' "$response")"
          echo "WAVE8_BRIDGE_STATE=${state}"

          if [[ "$state" == "OAUTH_VERIFIED" ]]; then
            profile="$(jq -r '.profile // "unknown"' "$response")"
            adobe_http="$(jq -r '.httpStatus // "unknown"' "$response")"
            token_type="$(jq -r '.tokenType // "unknown"' "$response")"
            expires="$(jq -r '.expiresIn // "unknown"' "$response")"
            echo "WAVE8_OAUTH_VERIFIED profile=${profile} http=${adobe_http} tokenType=${token_type} expiresIn=${expires}"
            echo "WAVE8_ACCESS_TOKEN=OBTAINED_BUT_NOT_EXPOSED"
            exit 0
          fi

          if [[ "$state" == "OAUTH_REJECTED" ]]; then
            echo "WAVE8_OAUTH_REJECTED"
            jq -r '.attempts[]? | "WAVE8_ATTEMPT profile=\(.profile // "unknown") http=\(.httpStatus // "unknown") error=\(.providerError // "unknown")"' "$response"
            exit 1
          fi

          echo "WAVE8_RESULT=NON_VERIFIED_STATE"
          jq -r 'keys | join(",")' "$response" | sed 's/^/WAVE8_RESPONSE_KEYS=/'
          exit 1
