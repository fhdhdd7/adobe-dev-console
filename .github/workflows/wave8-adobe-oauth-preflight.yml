name: Wave 8 Internal Transport Context

on:
  push:
    branches:
      - wave8-adobe-github-oauth-preflight

permissions:
  contents: read

jobs:
  inspect-internal-transport:
    name: Inspect AppDeploy internal API client context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract bounded transport context from live bundle
        shell: bash
        run: |
          set -euo pipefail
          base='https://wave-8-adobe-oauth-bridge-x52n4k.v2.appdeploy.ai'
          html="$(mktemp)"
          js="$(mktemp)"
          trap 'rm -f "$html" "$js"' EXIT
          curl --fail --silent --show-error --location "$base/" -o "$html"
          asset="$(grep -oE '<script[^>]+src="\./assets/index-[^"]+\.js"' "$html" | sed -E 's/.*src="([^"]+)"/\1/' | head -n1)"
          curl --fail --silent --show-error --location "$base/${asset#./}" -o "$js"
          python3 - "$js" <<'PY'
          import sys,re
          p=sys.argv[1]
          s=open(p,'r',encoding='utf-8').read()
          needles=['https://api-v2.appdeploy.ai/app/wave-8-adobe-oauth-bridge-x52n4k','x-appdeploy-keys-prefix','app-auth']
          for needle in needles:
              print('WAVE8_CONTEXT_START',needle)
              start=0
              count=0
              while True:
                  i=s.find(needle,start)
                  if i<0 or count>=4: break
                  a=max(0,i-900); b=min(len(s),i+len(needle)+1200)
                  chunk=s[a:b].replace('\n',' ')
                  # redact any long bearer/JWT-like strings defensively
                  chunk=re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~-]{20,}',r'\1[REDACTED]',chunk)
                  chunk=re.sub(r'eyJ[A-Za-z0-9._~-]{30,}','[JWT_REDACTED]',chunk)
                  print(chunk)
                  print('WAVE8_CONTEXT_BREAK')
                  start=i+len(needle); count+=1
              print('WAVE8_CONTEXT_END',needle)
          PY
