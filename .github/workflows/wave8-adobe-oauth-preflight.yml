name: Wave 8 External Adobe OAuth Bridge Probe

on:
  push:
    branches:
      - wave8-adobe-github-oauth-preflight

permissions:
  contents: read

concurrency:
  group: wave8-external-adobe-oauth-bridge-probe
  cancel-in-progress: false

jobs:
  external-bridge-probe:
    name: External auth-only bridge probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe AppDeploy stage proxy directly
        shell: bash
        run: |
          set -euo pipefail
          host='wave-8-adobe-oauth-bridge-x52n4k.v2.appdeploy.ai'
          proxy_ip='18.232.7.146'
          response="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$response" "$headers"' EXIT

          health_http="$({ curl --silent --show-error \
            --resolve "$host:443:$proxy_ip" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "https://$host/api/_healthcheck"; } || true)"
          echo "WAVE8_PROXY_HEALTH_HTTP=${health_http}"

          http_status="$({ curl --silent --show-error \
            --resolve "$host:443:$proxy_ip" \
            --dump-header "$headers" \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://$host/api/adobe/probe"; } || true)"

          echo "WAVE8_PROXY_PROBE_HTTP=${http_status}"
          grep -iE '^(content-type|server|www-authenticate|x-appdeploy[^:]*):' "$headers" | sed 's/^/WAVE8_HEADER /' || true

          if [[ "$http_status" != "200" ]]; then
            echo "WAVE8_BRIDGE_RESULT=STAGE_PROXY_HTTP_FAILURE"
            exit 1
          fi

          if ! jq -e 'type == "object" and (.state | type == "string")' "$response" >/dev/null 2>&1; then
            echo "WAVE8_BRIDGE_RESULT=BRIDGE_RESPONSE_INVALID"
            exit 1
          fi

          state="$(jq -r '.state' "$response")"
          echo "WAVE8_BRIDGE_STATE=${state}"

          if [[ "$state" == "OAUTH_VERIFIED" ]]; then
            profile="$(jq -r '.profile // "unknown"' "$response")"
            adobe_http="$(jq -r '.httpStatus // "unknown"' "$response")"
            expires="$(jq -r '.expiresIn // "unknown"' "$response")"
            echo "WAVE8_OAUTH_VERIFIED profile=${profile} http=${adobe_http} expiresIn=${expires}"
            echo "WAVE8_ACCESS_TOKEN=OBTAINED_BUT_NOT_EXPOSED"
            exit 0
          fi

          if [[ "$state" == "OAUTH_REJECTED" ]]; then
            echo "WAVE8_OAUTH_REJECTED"
            jq -r '.attempts[]? | "WAVE8_ATTEMPT profile=\(.profile // "unknown") http=\(.httpStatus // "unknown") error=\(.providerError // "unknown")"' "$response"
            exit 1
          fi

          echo "WAVE8_BRIDGE_RESULT=NON_VERIFIED_STATE"
          exit 1
