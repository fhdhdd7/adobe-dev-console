name: Wave 8 External Adobe OAuth Bridge Probe

on:
  push:
    branches:
      - wave8-adobe-github-oauth-preflight

permissions:
  contents: read

concurrency:
  group: wave8-external-adobe-oauth-bridge-probe
  cancel-in-progress: false

jobs:
  external-bridge-probe:
    name: External auth-only bridge probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe bridge with browser-like same-origin context
        shell: bash
        run: |
          set -euo pipefail
          base='https://wave-8-adobe-oauth-bridge-x52n4k.v2.appdeploy.ai'
          cookies="$(mktemp)"
          response="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$cookies" "$response" "$headers"' EXIT

          root_http="$({ curl --silent --show-error --location --cookie-jar "$cookies" --output /dev/null --write-out '%{http_code}' "$base/"; } || true)"
          echo "WAVE8_ROOT_HTTP=${root_http}"

          http_status="$({ curl --silent --show-error \
            --cookie "$cookies" \
            --dump-header "$headers" \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Origin: $base" \
            --header "Referer: $base/" \
            --header 'Sec-Fetch-Site: same-origin' \
            --header 'Sec-Fetch-Mode: cors' \
            --header 'Sec-Fetch-Dest: empty' \
            --data '{}' \
            "$base/api/adobe/probe"; } || true)"

          echo "WAVE8_BRIDGE_HTTP=${http_status}"
          grep -iE '^(content-type|server|www-authenticate|x-appdeploy[^:]*):' "$headers" | sed 's/^/WAVE8_HEADER /' || true

          if [[ "$http_status" != "200" ]]; then
            echo "WAVE8_BRIDGE_RESULT=BRIDGE_HTTP_FAILURE"
            exit 1
          fi

          if ! jq -e 'type == "object" and (.state | type == "string")' "$response" >/dev/null 2>&1; then
            echo "WAVE8_BRIDGE_RESULT=BRIDGE_RESPONSE_INVALID"
            exit 1
          fi

          state="$(jq -r '.state' "$response")"
          echo "WAVE8_BRIDGE_STATE=${state}"

          if [[ "$state" == "OAUTH_VERIFIED" ]]; then
            profile="$(jq -r '.profile // "unknown"' "$response")"
            adobe_http="$(jq -r '.httpStatus // "unknown"' "$response")"
            expires="$(jq -r '.expiresIn // "unknown"' "$response")"
            echo "WAVE8_OAUTH_VERIFIED profile=${profile} http=${adobe_http} expiresIn=${expires}"
            exit 0
          fi

          if [[ "$state" == "OAUTH_REJECTED" ]]; then
            echo "WAVE8_OAUTH_REJECTED"
            jq -r '.attempts[]? | "WAVE8_ATTEMPT profile=\(.profile // "unknown") http=\(.httpStatus // "unknown") error=\(.providerError // "unknown")"' "$response"
            exit 1
          fi

          echo "WAVE8_BRIDGE_RESULT=NON_VERIFIED_STATE"
          exit 1
