name: Penpot Authenticated API Check

on:
  push:
    branches:
      - penpot-integration-bootstrap
    paths:
      - ".github/workflows/penpot-connection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-penpot-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify secret is configured
        shell: bash
        env:
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PENPOT_ACCESS_TOKEN:-}" ]; then
            echo "::error::PENPOT_ACCESS_TOKEN is not configured"
            exit 1
          fi

      - name: Verify authenticated Penpot API access
        shell: bash
        env:
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # get-profile is intentionally NOT used here: current Penpot exposes it
          # with auth disabled and it can therefore produce a false-positive.
          endpoints=(
            "https://design.penpot.app/api/rpc/command/get-all-projects"
            "https://design.penpot.app/api/main/methods/get-all-projects"
          )

          saw_auth_rejection=0
          for endpoint in "${endpoints[@]}"; do
            response_file="$(mktemp)"
            http_code="$(curl --silent --show-error --location \
              --request POST \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Authorization: Token ${PENPOT_ACCESS_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "Accept: application/json" \
              --data '{}' \
              "$endpoint" || true)"

            if [ "$http_code" = "200" ] && [ -s "$response_file" ]; then
              rm -f "$response_file"
              echo "Penpot authenticated API access: PASS"
              exit 0
            fi

            rm -f "$response_file"
            if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              saw_auth_rejection=1
            fi
          done

          if [ "$saw_auth_rejection" -eq 1 ]; then
            echo "::error::Penpot rejected this credential for authenticated API methods"
          else
            echo "::error::Authenticated Penpot API method did not return a usable response"
          fi
          exit 1
